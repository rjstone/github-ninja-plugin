# git-cliff config: https://git-cliff.org/docs/configuration
# Generate:  npx git-cliff@2.14.2 -o CHANGELOG.md                (all releases + unreleased)
# Release:   npx git-cliff@2.14.2 --tag vX.Y.Z -o CHANGELOG.md   (before tagging vX.Y.Z)
# Notes:     npx git-cliff@2.14.2 --latest --strip header        (one release, for a GitHub release)

[changelog]
header = """
# Changelog

All notable changes to this repository. Generated by [git-cliff](https://git-cliff.org) from the
commit history (see `cliff.toml`); don't edit by hand.\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}**BREAKING** {% endif %}\
{{ commit.message | split(pat="\n") | first | upper_first | trim }} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/rjstone/github-ninja-plugin/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
# Conventional commits (see AGENTS.md); anything else lands under "Changes".
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
commit_parsers = [
  { message = "^Initial commit", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^(chore|ci|build)", group = "<!-- 6 -->Maintenance" },
  { message = ".*", group = "<!-- 7 -->Changes" },
]
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
