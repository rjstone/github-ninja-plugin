# CI: plugin and marketplace validation, generated skill index up to date, skill version bumps.
# On pushes to main, the "badges" job renders README badges (scripts/badges.sh) and
# force-pushes them as the single commit of the orphan branch "badges".
# Actions are pinned to commit SHAs (the version is in the comment).
name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: .claude-plugin/icon.png matches assets/icon.png
        # assets/icon.png is the one to edit; Claude Code finds the copy in .claude-plugin/ (the
        # manifest has no "icon" key: the claude.ai marketplace sync warns about it as unknown).
        run: cmp assets/icon.png .claude-plugin/icon.png || { echo "::error file=.claude-plugin/icon.png::differs from assets/icon.png (copy it again)"; exit 1; }
      - name: Validate the marketplace and plugin
        run: npx -y @anthropic-ai/claude-code@2.1.332 plugin validate .
      - name: Validate the plugin against the plugin directory's checks
        run: npx -y @anthropic-ai/claude-code@2.1.332 plugin validate . --profile directory
      - name: skills/index.json is up to date
        run: python3 scripts/build_skills_index.py --check
      - name: Changed skills bumped metadata.version
        env:
          # The commit to compare with: the PR base, else the commit before this push.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/check_skill_versions.py "$BASE"
      - name: Script tests
        run: python3 -m unittest discover -s tests -v
      - name: Tool and action pins applied (skill-pins.json, written-here skills)
        run: python3 scripts/pins.py --check

  badges:
    needs: check
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: badges
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Render badges
        env:
          RESULT: ${{ needs.check.result }}
        run: |
          case "$RESULT" in
            success) check="passing|brightgreen" ;;
            failure) check="failing|red" ;;
            *) check="$RESULT|lightgrey" ;;
          esac
          version=$(node -p "require('./.claude-plugin/plugin.json').version")
          license=$(node -p "require('./.claude-plugin/plugin.json').license")
          skills=$(ls -d skills/*/SKILL.md | wc -l | tr -d ' ')
          {
            echo "check|check|$check"
            echo "version|version|v$version|blue"
            echo "license|license|$license|blue"
            echo "skills|skills|$skills|blue"
          } > "$RUNNER_TEMP/badges.txt"
          bash scripts/badges.sh "$RUNNER_TEMP/badges.txt" "$RUNNER_TEMP/badges"
      - name: Push to the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          cd "$RUNNER_TEMP/badges"
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "badges for $SHA"
          git push -q --force "https://x-access-token:$GH_TOKEN@github.com/$REPO.git" badges
