# On a release tag (vX.Y.Z): build that release's notes with git-cliff (cliff.toml) and publish
# a GitHub Release. The tag itself is created by the maintainer (see AGENTS.md, "Releases").
# Actions are pinned to commit SHAs (the version is in the comment).
name: release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions: {}
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
      - name: Publish the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: RELEASE_NOTES.md
